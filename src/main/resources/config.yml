# OpShop Configuration

database:
  type: sqlite          # 'sqlite' or 'mysql'
  mysql:
    host: localhost
    port: 3306
    database: opshop
    username: root
    password: ""
    pool-size: 5
  sqlite:
    file: data.db

# Global default currency prices — applied to new items as initial values
global-defaults:
  prices:
    - currency: vault_main
      buy-price: 100.0
      sell-price: 50.0
    - currency: pp_tokens
      buy-price: 10.0
      sell-price: 5.0

# Currency definitions — VAULT and PLAYER_POINTS reference external economy plugins.
# CUSTOM_ITEM currencies are managed via /oshop admin currency add and stored in the database;
# do NOT define them here (they will be ignored).
currencies:
  vault_main:
    type: vault
    display-name: "Gold Coins"
    display-singular: "Gold Coin"

  pp_tokens:
    type: player_points
    display-name: "Tokens"
    display-singular: "Token"

# GUI settings
gui:
  title: "&8OpShop"
  filler-material: BLACK_STAINED_GLASS_PANE

# New items: if false, buy & sell are disabled by default (admin must toggle them on).
# This prevents players from buying items at the default placeholder price.
default-buy-sell-enabled: false

locale: zh_CN
debug: false
