  # log
  log:
    header: "&e===== Trace ID: {id} ====="
    player: "&7Buyer: &f{player}"
    item: "&7Item: &f{item}"
    quantity: "&7Quantity: &f{count}x"
    price: "&7Price: &f{price} {currency}"
    time: "&7Time: &f{time}"
  # view (GUI)
  view:
    title: "&8Trace #{id}"
    info-title: "&eTrace #{id}"
    player: "&7Buyer: &f{player}"
    item: "&7Item: &f{item}"
    type: "&7Type: &f{type}"
    quantity: "&7Quantity: &f{count}x"
    price-unit: "&7Price/unit: &f{price} {currency}"
    total: "&7Total: &f{price} {currency}"
    time: "&7Time: &f{time}"
    id: "&7Trace ID: &f{id}"
  # help
  help-list-item: "&e/oshop admin trace list item <item> [page] &7— List trace records for an item"
  help-list-player: "&e/oshop admin trace list player <player> [page] &7— List trace records for a player"
  help-log: "&e/oshop admin trace log [ID] &7— View trace record (reads held item if no ID)"
  help-view: "&e/oshop admin trace view [ID] &7— View trace record in GUI (reads held item if no ID)"
